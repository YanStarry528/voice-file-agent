<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语音文件 Agent</title>
<style>
  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --primary: #5b6cff;
    --primary-dark: #4456e6;
    --text: #1f2430;
    --muted: #8a90a2;
    --success: #16a34a;
    --danger: #dc2626;
    --border: #e7e9f0;
    --radius: 16px;
    --shadow: 0 8px 30px rgba(31, 36, 48, 0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #eef0ff 0%, #f6f7fb 50%, #eef7ff 100%);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px 60px; }
  header { text-align: center; margin-bottom: 28px; }
  header h1 { font-size: 28px; font-weight: 700; }
  header p { color: var(--muted); margin-top: 6px; }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 20px;
  }
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 36px 20px;
    text-align: center;
    cursor: pointer;
    transition: all .2s;
    background: #fafbfe;
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: var(--primary);
    background: #f3f5ff;
  }
  .dropzone .icon { font-size: 40px; margin-bottom: 10px; }
  .dropzone p { color: var(--muted); }
  .dropzone .pick { color: var(--primary); font-weight: 600; cursor: pointer; }
  .dropzone .filename { margin-top: 10px; font-weight: 600; color: var(--text); }
  .btn {
    display: inline-block;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    padding: 12px 22px;
    transition: all .2s;
  }
  .btn.primary {
    width: 100%;
    margin-top: 16px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
  }
  .btn.primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(91,108,255,.35); }
  .btn.primary:disabled { opacity: .5; cursor: not-allowed; }
  .result-block { display: none; }
  .result-block.show { display: block; }
  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  .field .label { font-size: 12px; color: var(--muted); font-weight: 700; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
  .field .value { background: #f7f8fc; border-radius: 10px; padding: 14px; word-break: break-word; white-space: pre-wrap; }
  .field pre.value { white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
  .success-text { color: var(--success); font-weight: 600; }
  .error-text { color: var(--danger); font-weight: 600; }
  .filelist { list-style: none; }
  .filelist li {
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 6px;
    background: #f7f8fc;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .filelist li .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); flex-shrink: 0; }
  .filelist .empty { color: var(--muted); background: none; }
  .spinner {
    display: inline-block; width: 15px; height: 15px; vertical-align: -2px;
    border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%;
    animation: spin .7s linear infinite; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎤 语音指令文件 Agent</h1>
    <p>上传一段录音，自动识别内容并执行文件操作</p>
  </header>

  <section class="card">
    <div class="dropzone" id="dropzone">
      <div class="icon">🎙️</div>
      <p>拖拽音频到这里，或 <span class="pick">点击选择文件</span></p>
      <p class="filename" id="filename" style="display:none;"></p>
      <input type="file" id="audio" accept="audio/*,.wav,.mp3,.m4a" hidden>
    </div>
    <button class="btn primary" id="submit" disabled>开始处理</button>
  </section>

  <section class="result-block" id="result">
    <div class="card">
      <div class="field">
        <div class="label">识别文字</div>
        <div class="value" id="text"></div>
      </div>
      <div class="field">
        <div class="label">识别意图</div>
        <pre class="value" id="intent"></pre>
      </div>
      <div class="field">
        <div class="label">执行结果</div>
        <div class="value" id="result-text"></div>
      </div>
    </div>
  </section>

  <section class="card">
    <h2 style="font-size:17px;margin-bottom:14px;">📁 output 目录文件</h2>
    <ul class="filelist" id="filelist">
      {% for f in files %}
      <li><span class="dot"></span>{{ f }}</li>
      {% else %}
      <li class="empty">暂无文件</li>
      {% endfor %}
    </ul>
  </section>
</div>

<script>
  const dropzone = document.getElementById('dropzone');
  const input = document.getElementById('audio');
  const filenameEl = document.getElementById('filename');
  const submitBtn = document.getElementById('submit');
  const resultBlock = document.getElementById('result');

  let selectedFile = null;

  function setFile(file) {
    selectedFile = file;
    if (file) {
      filenameEl.textContent = file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';
      filenameEl.style.display = 'block';
      submitBtn.disabled = false;
    }
  }

  dropzone.addEventListener('click', () => input.click());
  input.addEventListener('change', () => setFile(input.files[0]));

  ['dragover', 'dragenter'].forEach(ev => dropzone.addEventListener(ev, e => {
    e.preventDefault();
    dropzone.classList.add('dragover');
  }));
  ['dragleave', 'drop'].forEach(ev => dropzone.addEventListener(ev, e => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
  }));
  dropzone.addEventListener('drop', e => {
    if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
  });

  submitBtn.addEventListener('click', async () => {
    if (!selectedFile) return;
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span>Agent 正在处理...';
    resultBlock.classList.remove('show');

    const fd = new FormData();
    fd.append('audio', selectedFile);

    try {
      const resp = await fetch('/api/upload', { method: 'POST', body: fd });
      const data = await resp.json();
      document.getElementById('text').textContent = data.text || '(空)';
      document.getElementById('intent').textContent = JSON.stringify(data.intent, null, 2);
      const rt = document.getElementById('result-text');
      rt.textContent = data.result || '';
      rt.className = 'value' + (data.result && data.result.includes('失败') ? ' error-text' : ' success-text');
      renderFiles(data.files || []);
      resultBlock.classList.add('show');
    } catch (err) {
      document.getElementById('text').textContent = '';
      document.getElementById('intent').textContent = '';
      const rt = document.getElementById('result-text');
      rt.textContent = '请求失败：' + err.message;
      rt.className = 'value error-text';
      resultBlock.classList.add('show');
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = '开始处理';
    }
  });

  function renderFiles(files) {
    const ul = document.getElementById('filelist');
    ul.innerHTML = '';
    if (!files.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = '暂无文件';
      ul.appendChild(li);
      return;
    }
    files.forEach(f => {
      const li = document.createElement('li');
      const dot = document.createElement('span');
      dot.className = 'dot';
      li.appendChild(dot);
      li.appendChild(document.createTextNode(f));
      ul.appendChild(li);
    });
  }
</script>
</body>
</html>
